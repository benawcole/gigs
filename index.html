<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upcoming gigs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #ffffff; --bg: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 500 18px/1.45 Sutro, bhhm, Alegreya, Georgia, serif; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; flex-direction: column; margin: 0 0 1.4em; }
  .when { text-decoration: underline; text-underline-offset: 2px; }
  .venue { font-weight: 800; }
  .title { font-style: italic; }
  a { color: inherit; }
  .empty { font-style: italic; opacity: .8; }
</style>
</head>
<body>
<ul>
<li class="empty">New dates coming soon.</li>
</ul>
<script>
  // Tell an embedding page how tall this list is, so the iframe can fit it.
  function sendHeight() {
    parent.postMessage({ benawcoleGigsHeight: document.documentElement.scrollHeight }, "*");
  }
  addEventListener("load", sendHeight);
  addEventListener("resize", sendHeight);
  if (document.fonts) document.fonts.ready.then(sendHeight);
</script>
</body>
</html>
